spring.application.name=blog
# git config --global branch.sort -committerdate - sirve para que veamos las ramas (al escribir git branch) en consola en orden cronológico
# Configurar las credenciales de conexion a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/blog
spring.datasource.username=root
spring.datasource.password=Temp2026

# Para configurar el ORM Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# La siguiente clave (key) ofrece mas informacion por la consola respecto a las consultas
# o sentencias de SQL generadas por HIBERNATE
spring.jpa.properties.hibernate.format_sql=true


# Configuración JWT (Clave codificada en Base64)
jwt.secret=bWlDbGF2ZVNlY3JldGFTdXBlclNlZ3VyYVBhcmFFbEJsb2dEZVNwcmluZ0Jvb3QyMDI2
# Tiempo de expiración del token (24 horas)
jwt.expiration=86400000

